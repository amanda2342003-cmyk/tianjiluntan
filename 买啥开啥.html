    function parseCSV(text) {
        let lines = text.split('\n');
        return lines.map(line => {
            let matches = line.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g);
            if (!matches) return line.split(',').map(s => s.replace(/^"|"$/g, '').trim());
            return matches.map(s => s.replace(/^"|"$/g, '').trim());
        });
    }

    function getPredictDanShuangForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        let cycle = Math.floor((actualKy - 1) / 2);
        return cycle % 2 === 0 ? "大数大数" : "小数小数";
    }

    function getDanShuangByNum(numStr) {
        if (DA.includes(numStr)) return "大数大数";
        if (XIAO.includes(numStr)) return "小数小数";
        return "";
    }

    function formatTwoDigits(val) {
        if (!val) return '';
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const resDulie = await fetch(URL_DULIEU);
            const textDulie = await resDulie.text();
            const rowsDulie = parseCSV(textDulie);

            rowsDulie.forEach(r => {
                if (r && r[0]) {
                    let formattedNum = formatTwoDigits(r[0]);
                    let animalB = r[1] ? String(r[1]).trim() : '';
                    let animalE = r[4] ? String(r[4]).trim() : '';
                    
                    if (formattedNum) {
                        if (animalB) duLieuMapB[formattedNum] = animalB;
                        if (animalE) duLieuMapE[formattedNum] = animalE;
                    }
                }
            });

            const resKQ = await fetch(URL_KQ);
            const textKQ = await resKQ.text();
            const rows = parseCSV(textKQ);

            let parsedList = [];
            let lastXRowIndex = -1;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r || r.length === 0) continue;

                    let isXRow = false;
                    for (let colIdx = 1; colIdx <= 7; colIdx++) {
                        if (r[colIdx] && String(r[colIdx]).trim().toLowerCase() === 'x') {
                            isXRow = true;
                            break;
                        }
                    }

                    if (isXRow) {
                        lastXRowIndex = i;
                        continue;
                    }

                    if (!r[0]) continue;

                    let kyRaw = String(r[0]).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7]) {
                        let valStr = String(r[7]).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            rowIndex: i,
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    item.useMapE = (lastXRowIndex !== -1 && item.rowIndex > lastXRowIndex);
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let winEntries = [];
            let consecutiveLosses = 0;

            for (let i = doneList.length - 1; i >= 0; i--) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = (DA.includes(item.numTe) || XIAO.includes(item.numTe));
                let isWin = isValidNum && actual && (predicted === actual);
                
                if (isWin) {
                    consecutiveLosses = 0;
                    winEntries.push({ item, predicted, actual });
                    if (winEntries.length === 14) {
                        break;
                    }
                } else {
                    consecutiveLosses++;
                    if (consecutiveLosses >= 3) {
                        break;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-family:'Times New Roman';font-size:12pt;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrNext}期：<span style="color:#FF00FF;">买嘛中嘛</span><span style="color:#0000FF;">（${predictNext}）</span>开:<span style="color:#FF0000;">？00</span>准！</p>`;

            let historyOutputs = [];

            for (let i = 0; i < winEntries.length; i++) {
                let entry = winEntries[i];
                let activeMap = entry.item.useMapE ? duLieuMapE : duLieuMapB;
                let shengXiaoWin = activeMap[entry.item.numTe] || duLieuMapB[entry.item.numTe] || '';
                
                let resStrWin = shengXiaoWin + entry.item.numTe;
                let kyStr = formatThreeDigits(entry.item.kyNum);
                
                let formattedPredictHtml = `<span class="win-digit">${entry.predicted}</span>`;
                
                historyOutputs.push(`<p style="font-family:'Times New Roman';font-size:12pt;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期：<span style="color:#FF00FF;">买嘛中嘛</span><span style="color:#0000FF;">（${formattedPredictHtml}）</span>开:<span style="color:#FF0000;">${resStrWin}</span>准！</p>`);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:'Times New Roman';font-size:12pt;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期：<span style="color:#FF00FF;">买嘛中嘛</span><span style="color:#0000FF;">（發發發發）</span>开:<span style="color:#FF0000;">？00</span>准！</p>`;
                let defaultHtml2 = `<p style="font-family:'Times New Roman';font-size:12pt;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期：<span style="color:#FF00FF;">买嘛中嘛</span><span style="color:#0000FF;">（發發發發）</span>开:<span style="color:#FF0000;">？00</span>准！</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:'Times New Roman';font-size:12pt;line-height:32px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期：<span style="color:#FF00FF;">买嘛中嘛</span><span style="color:#0000FF;">（發發發發）</span>开:<span style="color:#FF0000;">？00</span>准！</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '<p style="color:red;">Không thể tải dữ liệu từ Google Sheets. Vui lòng kiểm tra lại quyền truy cập trang tính.</p>';
        }
    }
