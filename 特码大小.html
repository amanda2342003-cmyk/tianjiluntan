        361: "小数", 362: "大数", 363: "小数", 364: "大数", 365: "小数"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }
        let cycle = Math.floor((kyNum - 1) / 2);
        return cycle % 2 === 0 ? "大数" : "小数";
    }

    function getDanShuangByNum(numStr) {
        if (DA_SHU.includes(numStr)) return "大数";
        if (XIAO_SHU.includes(numStr)) return "小数";
        return "";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];
            let maxKyNum = 0;

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '' && String(r[7].v).trim() !== '00') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                        if (kyOnlyNum > maxKyNum) {
                            maxKyNum = kyOnlyNum;
                        }
                    }
                }
            }

            let doneList = [];
            let limitRange = Math.min(parsedList.length, 365);
            let startIndex = parsedList.length - limitRange;

            for (let i = startIndex; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                }
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let actual = getDanShuangByNum(item.numTe);
                let isValidNum = (DA_SHU.includes(item.numTe) || XIAO_SHU.includes(item.numTe));
                let isWin = isValidNum && actual && (predicted === actual);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = evaluatedDoneList.length;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            }

            let nextKyNum = maxKyNum + 1;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<table border="1" width="100%" cellpadding="2" bordercolor="#CCCCCC" id="table319" style="margin: 0px; padding: 0px; border-collapse: collapse; border-spacing: 0px; color: rgb(68, 68, 68); font-family: tahoma, 微软雅黑, 宋体, arial, georgia, verdana, helvetica, sans-serif; font-size: 14pt;">\n\t<tbody style="margin: 0px; padding: 0px;">\n\t\t<tr style="margin:0px;padding:0px;">\n\t\t\t<td style="margin:0px;padding:6px 2px;border:1px solid rgb(229,229,229);word-break:break-all;font-size:16px;font-family:SimSun,NSimSun,'Songti SC',serif;font-weight:700;">\n\t\t\t\t${kyStrNext}期:<span style="color:#9E6101;">特码</span><span style="color:#0000FF;">大</span><span style="color:#FF00FF;">小</span><span style="color:#99ff33;">【</span><span style="color: rgb(255, 0, 0)">${predictNext}</span><span style="color:#99FF33;">】</span>开:<span style="color: rgb(255, 0, 0)">？00</span>准\n\t\t\t</td>\n\t\t</tr>\t\n\t</tbody>\n</table>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let actual = getDanShuangByNum(item.numTe);
                    let isValidNum = (DA_SHU.includes(item.numTe) || XIAO_SHU.includes(item.numTe));
                    let isWin = isValidNum && actual && (predicted === actual);

                    if (isWin) {
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        let formattedPredictHtml = `<span style="color: rgb(255, 0, 0); background-color: yellow;">${predicted}</span>`;
                        historyOutputs.push(`<table border="1" width="100%" cellpadding="2" bordercolor="#CCCCCC" id="table319" style="margin: 0px; padding: 0px; border-collapse: collapse; border-spacing: 0px; color: rgb(68, 68, 68); font-family: tahoma, 微软雅黑, 宋体, arial, georgia, verdana, helvetica, sans-serif; font-size: 14pt;">\n\t<tbody style="margin: 0px; padding: 0px;">\n\t\t<tr style="margin:0px;padding:0px;">\n\t\t\t<td style="margin:0px;padding:6px 2px;border:1px solid rgb(229,229,229);word-break:break-all;font-size:16px;font-family:SimSun,NSimSun,'Songti SC',serif;font-weight:700;">\n\t\t\t\t${kyStr}期:<span style="color:#9E6101;">特码</span><span style="color:#0000FF;">大</span><span style="color:#FF00FF;">小</span><span style="color:#99ff33;">【</span>${formattedPredictHtml}<span style="color:#99FF33;">】</span>开:<span style="color: rgb(255, 0, 0)">${resStrWin}</span></span>准\n\t\t\t</td>\n\t\t</tr>\t\n\t</tbody>\n</table>`;
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<table border="1" width="100%" cellpadding="2" bordercolor="#CCCCCC" id="table319" style="margin: 0px; padding: 0px; border-collapse: collapse; border-spacing: 0px; color: rgb(68, 68, 68); font-family: tahoma, 微软雅黑, 宋体, arial, georgia, verdana, helvetica, sans-serif; font-size: 14pt;">\n\t<tbody style="margin: 0px; padding: 0px;">\n\t\t<tr style="margin:0px;padding:0px;">\n\t\t\t<td style="margin:0px;padding:6px 2px;border:1px solid rgb(229,229,229);word-break:break-all;font-size:16px;font-family:SimSun,NSimSun,'Songti SC',serif;font-weight:700;">\n\t\t\t\t${kyStr1}期:<span style="color:#9E6101;">特码</span><span style="color:#0000FF;">大</span><span style="color:#FF00FF;">小</span><span style="color:#99ff33;">【</span><span style="color: rgb(255, 0, 0)">發發</span><span style="color:#99FF33;">】</span>开:<span style="color: rgb(255, 0, 0)">？00</span>准\n\t\t\t</td>\n\t\t</tr>\t\n\t</tbody>\n</table>`;
                let defaultHtml2 = `<table border="1" width="100%" cellpadding="2" bordercolor="#CCCCCC" id="table319" style="margin: 0px; padding: 0px; border-collapse: collapse; border-spacing: 0px; color: rgb(68, 68, 68); font-family: tahoma, 微软雅黑, 宋体, arial, georgia, verdana, helvetica, sans-serif; font-size: 14pt;">\n\t<tbody style="margin: 0px; padding: 0px;">\n\t\t<tr style="margin:0px;padding:0px;">\n\t\t\t<td style="margin:0px;padding:6px 2px;border:1px solid rgb(229,229,229);word-break:break-all;font-size:16px;font-family:SimSun,NSimSun,'Songti SC',serif;font-weight:700;">\n\t\t\t\t${kyStr2}期:<span style="color:#9E6101;">特码</span><span style="color:#0000FF;">大</span><span style="color:#FF00FF;">小</span><span style="color:#99ff33;">【</span><span style="color: rgb(255, 0, 0)">發發</span><span style="color:#99FF33;">】</span>开:<span style="color: rgb(255, 0, 0)">？00</span>准\n\t\t\t</td>\n\t\t</tr>\t\n\t</tbody>\n</table>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<table border="1" width="100%" cellpadding="2" bordercolor="#CCCCCC" id="table319" style="margin: 0px; padding: 0px; border-collapse: collapse; border-spacing: 0px; color: rgb(68, 68, 68); font-family: tahoma, 微软雅黑, 宋体, arial, georgia, verdana, helvetica, sans-serif; font-size: 14pt;">\n\t<tbody style="margin: 0px; padding: 0px;">\n\t\t<tr style="margin:0px;padding:0px;">\n\t\t\t<td style="margin:0px;padding:6px 2px;border:1px solid rgb(229,229,229);word-break:break-all;font-size:16px;font-family:SimSun,NSimSun,'Songti SC',serif;font-weight:700;">\n\t\t\t\t${kyStrExtra}期:<span style="color:#9E6101;">特码</span><span style="color:#0000FF;">大</span><span style="color:#FF00FF;">小</span><span style="color:#99ff33;">【</span><span style="color: rgb(255, 0, 0)">發發</span><span style="color:#99FF33;">】</span>开:<span style="color: rgb(255, 0, 0)">？00</span>准\n\t\t\t</td>\n\t\t</tr>\t\n\t</tbody>\n</table>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
