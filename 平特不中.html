    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Invalid response format");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 336) + 1;
        return STATIC_PREDICTIONS[actualKy] || ["$$", "$$", "$$", "$$", "$$"];
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            const rawKQ = await fetchJSONP(URL_KQ);
            const rowsKQ = rawKQ.table ? rawKQ.table.rows : [];

            // Kiểm tra xem bảng KQ_XIANGGANG có chứa ký tự 'x' hoặc 'X' hay không
            let hasX = false;
            if (rowsKQ) {
                for (let r of rowsKQ) {
                    if (r.c) {
                        for (let cell of r.c) {
                            if (cell && cell.v !== null && cell.v !== undefined) {
                                if (String(cell.v).toLowerCase().includes('x')) {
                                    hasX = true;
                                    break;
                                }
                            }
                        }
                    }
                    if (hasX) break;
                }
            }

            // Chọn cột chứa con giáp trong bảng DULIEU: nếu có 'x'/'X' chọn Cột E (index 4), ngược lại chọn Cột B (index 1)
            let animalColIndex = hasX ? 4 : 1;

            // Lấy dữ liệu map số -> con giáp từ sheet DULIEU
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animalCell = r.c[animalColIndex];
                        let animal = (animalCell && animalCell.v !== null && animalCell.v !== undefined) ? String(animalCell.v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            let parsedList = [];
            if (rowsKQ) {
                for (let i = 0; i < rowsKQ.length; i++) {
                    const r = rowsKQ[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    // Đọc từ Giải 1 đến Giải 6 (Cột 1->6) và Giải đặc biệt (Cột 7)
                    let drawAll7 = [];
                    let teNum = "";

                    // Cột 1 đến 6
                    for (let col = 1; col <= 6; col++) {
                        if (r[col] && r[col].v !== null && r[col].v !== undefined) {
                            let formatted = formatTwoDigits(r[col].v);
                            if (formatted) drawAll7.push(formatted);
                        }
                    }

                    // Cột 7 (Giải Đặc Biệt)
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let formattedTe = formatTwoDigits(r[7].v);
                        if (formattedTe) {
                            teNum = formattedTe;
                            drawAll7.push(formattedTe);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            drawNumbers: drawAll7,
                            numTe: teNum
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.drawNumbers && item.drawNumbers.length > 0 && item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedList = getPredictForKy(item.kyNum);
                
                let teInt = parseInt(item.numTe, 10);
                let isValidData = (!isNaN(teInt) && teInt >= 1 && teInt <= 49);

                let isHit = false;
                if (isValidData) {
                    // Nếu có bất kỳ số dự đoán nào xuất hiện trong cả 7 giải -> Thua (Hit)
                    isHit = item.drawNumbers.some(num => predictedList.includes(num));
                } else {
                    // Nếu dữ liệu không hợp lệ -> Tính là Thua
                    isHit = true; 
                }

                let isWin = !isHit; // Không xuất hiện con nào trong 7 giải mới là Thắng

                // Ghép kết quả hiển thị 7 giải: 6 giải đầu nối '-' + 特 + Giải ĐB
                let formattedResultStr = "";
                if (isValidData && item.drawNumbers.length >= 7) {
                    let normal6 = item.drawNumbers.slice(0, 6).join('-');
                    formattedResultStr = `${normal6}特${item.numTe}`;
                } else {
                    formattedResultStr = "00-00-00-00-00-00特00";
                }
                
                evaluatedDoneList.push({ item, isWin, predictedList, formattedResultStr });
            }

            // Đếm số kỳ thua liên tiếp ở hiện tại
            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNextList = getPredictForKy(nextKyNum);
            let predictNextStr = predictNextList.join('.');
            let kyStrNext = formatThreeDigits(nextKyNum);

            // Kỳ dự đoán mới nhất
            let htmlNextKy = `<p style="font-family:宋体;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrNext}期:〖<span style="color:#CC3300;">${predictNextStr}</span>〗<br /><span style="color:#FF0000;">开00-00-00-00-00-00</span>特00<span style="color:#0000FF;">赢</span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;

                    if (evalItem.isWin) {
                        let kyStr = formatThreeDigits(item.kyNum);
                        let predStr = evalItem.predictedList.join('.');
                        historyOutputs.push(`<p style="font-family:宋体;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr}期:〖<span style="color:#CC3300;">${predStr}</span>〗<br /><span style="color:#FF0000;">开${evalItem.formattedResultStr}</span><span style="color:#0000FF;">赢</span></p>`);
                    }
                }
            }

            historyOutputs.reverse();

            // Giới hạn tối đa 14 kỳ trúng + 1 kỳ dự đoán mới = 15 kỳ
            if (historyOutputs.length > 14) {
                historyOutputs = historyOutputs.slice(0, 14);
            }

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            // Nếu trượt >= 3 kỳ liên tiếp thì bổ sung kỳ mặc định dạng $$.$$.$$.$$.$$
            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-family:宋体;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr1}期:〖<span style="color:#CC3300;">$$.$$.$$.$$.$$</span>〗<br /><span style="color:#FF0000;">开00-00-00-00-00-00</span>特00<span style="color:#0000FF;">赢</span></p>`;
                let defaultHtml2 = `<p style="font-family:宋体;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStr2}期:〖<span style="color:#CC3300;">$$.$$.$$.$$.$$</span>〗<br /><span style="color:#FF0000;">开00-00-00-00-00-00</span>特00<span style="color:#0000FF;">赢</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-family:宋体;font-size:16px;line-height:25px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${kyStrExtra}期:〖<span style="color:#CC3300;">$$.$$.$$.$$.$$</span>〗<br /><span style="color:#FF0000;">开00-00-00-00-00-00</span>特00<span style="color:#0000FF;">赢</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = '';
        }
    }
    initPredict();
</script>
